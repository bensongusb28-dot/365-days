<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>365 Days</title>
  <meta name="description" content="One photo and one journal entry, every day.">

  <!-- iPhone Home Screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="365 Days">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8c.3-.4.7-.7 1.2-.7h3c.5 0 .9.3 1.2.7L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.4" r="3.4"/></svg>
      <span>Today</span>
    </a>
    <a href="#/calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
      <span>Calendar</span>
    </a>
    <a href="#/timeline" data-tab="timeline">
      <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="7" rx="2"/><rect x="5" y="13" width="14" height="7" rx="2"/></svg>
      <span>Timeline</span>
    </a>
    <a href="#/projects" data-tab="projects">
      <svg viewBox="0 0 24 24"><path d="M5 6.5 6.5 8 9 5M5 12.5 6.5 14 9 11M5 18.5 6.5 20 9 17M12.5 6.5H20M12.5 12.5H20M12.5 18.5H20"/></svg>
      <span>Projects</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></svg>
      <span>More</span>
    </a>
  </nav>

  <div id="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
